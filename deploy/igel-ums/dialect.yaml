# IGEL UMS (IMI) dialect for endpoint-aiops — a DEPLOY OVERLAY, not part of the
# vendor-neutral package. Merge the `dialect:` block into your target in
# ~/.endpoint-aiops/config.yaml so the generic endpoint tools speak to an IGEL
# Universal Management Suite via its IGEL Management Interface (IMI) REST API.
#
# 待核实 — the exact IMI resource paths and field names vary by UMS/IMI version;
# confirm each against the IMI API documentation for your UMS before relying on it.
#
# Auth: IMI does NOT accept a static Bearer token. It logs in with HTTP Basic at
# POST /umsapi/v3/login and then carries a JSESSIONID cookie. That is implemented
# as the `imi-session` auth strategy, selected by `auth:` below — a dialect that
# only mapped paths would still be rejected on its very first call. The account
# is a UMS administrator (set `username:` on the target; the password goes in the
# encrypted store), and it needs at least Read/Browse at the Devices level:
# with fewer permissions IMI returns EMPTY LISTS rather than an error.

targets:
  - name: ums1
    host: ums.example.local
    port: 8443
    api_path: /umsapi/v3
    verify_ssl: false              # self-signed lab UMS only
    username: ums-admin            # UMS account; password lives in secrets.enc
    dialect:
      name: igel-ums
      auth: imi-session            # HTTP Basic login -> JSESSIONID cookie
      endpoints_path: /thinclients
      endpoint_path: /thinclients/{id}
      # IMI exposes no login/boot session resource. Null (not a guessed path) so
      # the session tools name the absent resource instead of 404ing against an
      # invented URL — matching the shipped `igel-ums` preset.
      sessions_path: null
      version_path: /serverstatus
      profile_path: /thinclients/{id}/profile        # 待核实
      reboot_path: /thinclients/{id}/commands/reboot  # 待核实
      list_key: null                 # IMI returns a bare array (待核实)
      fields:
        id: [id, unitID, mac]
        hostname: [name, unitName]
        os: [productId, firmwareType]
        osBuild: [firmwareVersion, firmware]
        agentVersion: [agentVersion]
        patchLevel: [patchLevel, firmwareVersion]
        profileId: [profileId, configId]
        online: [online, connected]
        lastSeenHours: [lastContactHours]
        # sessions (待核实 — IMI session/usage field names)
        sessionEndpoint: [unitID, name]
        user: [user, lastUser]
        loginMs: [loginDurationMs]
        bootMs: [bootDurationMs]
        timestamp: [timestamp, ts]
        result: [result, status]
